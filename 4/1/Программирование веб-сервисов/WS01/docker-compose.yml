services:
  ws01-01-a:
    image: ws01-01:local
    build:
      context: .
      dockerfile: Dockerfile.ws01
      args:
        PREBUILT_DIR: prebuilt/ws01-01
        EXECUTABLE_NAME: WS01_01
    environment:
      ASPNETCORE_URLS: http://+:8080
      INSTANCE_NAME: ws01-01-a
    expose:
      - "8080"

  ws01-01-b:
    image: ws01-01:local
    build:
      context: .
      dockerfile: Dockerfile.ws01
      args:
        PREBUILT_DIR: prebuilt/ws01-01
        EXECUTABLE_NAME: WS01_01
    environment:
      ASPNETCORE_URLS: http://+:8080
      INSTANCE_NAME: ws01-01-b
    expose:
      - "8080"

  sticky-gateway:
    image: sticky-gateway:local
    build:
      context: .
      dockerfile: Dockerfile.gateway
      args:
        PREBUILT_DIR: prebuilt/sticky-gateway
        EXECUTABLE_NAME: StickyGateway
    environment:
      ASPNETCORE_URLS: http://+:8080
      ReverseProxy__Clusters__ws01Cluster__Destinations__instance1__Address: http://ws01-01-a:8080/
      ReverseProxy__Clusters__ws01Cluster__Destinations__instance2__Address: http://ws01-01-b:8080/
    ports:
      - "5100:8080"
    depends_on:
      - ws01-01-a
      - ws01-01-b

  ws01-02-a:
    image: ws01-02:local
    build:
      context: .
      dockerfile: Dockerfile.ws01
      args:
        PREBUILT_DIR: prebuilt/ws01-02
        EXECUTABLE_NAME: WS01_02
    environment:
      ASPNETCORE_URLS: http://+:8080
      INSTANCE_NAME: ws01-02-a
    expose:
      - "8080"

  ws01-02-b:
    image: ws01-02:local
    build:
      context: .
      dockerfile: Dockerfile.ws01
      args:
        PREBUILT_DIR: prebuilt/ws01-02
        EXECUTABLE_NAME: WS01_02
    environment:
      ASPNETCORE_URLS: http://+:8080
      INSTANCE_NAME: ws01-02-b
    expose:
      - "8080"

  roundrobin-gateway:
    image: roundrobin-gateway:local
    build:
      context: .
      dockerfile: Dockerfile.gateway
      args:
        PREBUILT_DIR: prebuilt/roundrobin-gateway
        EXECUTABLE_NAME: RoundRobinGateway
    environment:
      ASPNETCORE_URLS: http://+:8080
      ReverseProxy__Clusters__ws01_02_cluster__Destinations__server1__Address: http://ws01-02-a:8080/
      ReverseProxy__Clusters__ws01_02_cluster__Destinations__server2__Address: http://ws01-02-b:8080/
    ports:
      - "5300:8080"
    depends_on:
      - ws01-02-a
      - ws01-02-b
